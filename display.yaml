substitutions:
  name: "crowpanel"
  friendly_name: "CrowPanel Smart Controller"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: qio
    board_build.psram_type: opi
  on_boot:
    priority: 600
    then:
      - switch.turn_on: lcd_power_switch
      - switch.turn_on: backlight_power_switch
      - delay: 100ms
      - light.turn_on:
          id: backlight
          brightness: 100%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: "WIFI_SSID"
  password: "WIFI_PASSWORD"

api:

ota:
  - platform: esphome

logger:

# SPI Bus for Display
spi:
  clk_pin: GPIO10
  mosi_pin: GPIO11

# I2C Bus for Touch
i2c:
  - id: bus_touch
    sda: GPIO6
    scl: GPIO7
    scan: false

# CST816S Touchscreen
touchscreen:
  - platform: cst816
    id: touch
    i2c_id: bus_touch
    interrupt_pin: GPIO5
    reset_pin: GPIO13

# Power rails
output:
  - platform: gpio
    id: lcd_power
    pin: GPIO1
  - platform: gpio
    id: backlight_power
    pin: GPIO2
  - platform: ledc
    id: backlight_pwm
    pin: GPIO46
    frequency: 1000Hz

switch:
  - platform: output
    id: lcd_power_switch
    name: "LCD Power"
    output: lcd_power
    restore_mode: ALWAYS_ON
    internal: true
  - platform: output
    id: backlight_power_switch
    name: "Backlight Power"
    output: backlight_power
    restore_mode: ALWAYS_ON
    internal: true

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    model: GC9A01A
    id: main_display
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    dimensions:
      width: 240
      height: 240
    rotation: 0
    invert_colors: false
    data_rate: 40MHz

globals:
  - id: current_page
    type: int
    initial_value: "0" # 0: Main, 1: Lights, 2: Media, 3: Control
  - id: selected_menu_item
    type: int
    initial_value: "0"
  - id: selected_entity_type
    type: int
    initial_value: "0" # 0: None, 1: Light, 2: Media
  - id: control_value
    type: int
    initial_value: "50"

sensor:
  - platform: rotary_encoder
    id: dial
    name: "Dial Position"
    pin_a: GPIO45
    pin_b: GPIO42
    resolution: 1
    on_clockwise:
      - lambda: |-
          if (id(current_page) == 0) {
            id(selected_menu_item) = 1;
            id(script_update_menu_highlight)->execute();
          } else if (id(current_page) == 1) {
            // we only have 1 entity and a back button for lights
            id(selected_menu_item) = (id(selected_menu_item) == 0) ? 1 : 0;
            // update focus (not fully implemented visual highlight here yet)
          } else if (id(current_page) == 2) {
            // we only have 1 entity and a back button for media
            id(selected_menu_item) = (id(selected_menu_item) == 0) ? 1 : 0;
            // update focus (not fully implemented visual highlight here yet)
          } else if (id(current_page) == 3) {
            id(control_value) = std::min(id(control_value) + 5, 100);
            if (id(selected_entity_type) == 1) {
              id(script_update_light)->execute();
            } else if (id(selected_entity_type) == 2) {
              id(script_update_media)->execute();
            }
          }
    on_anticlockwise:
      - lambda: |-
          if (id(current_page) == 0) {
            id(selected_menu_item) = 0;
            id(script_update_menu_highlight)->execute();
          } else if (id(current_page) == 1) {
            id(selected_menu_item) = (id(selected_menu_item) == 0) ? 1 : 0;
          } else if (id(current_page) == 2) {
            id(selected_menu_item) = (id(selected_menu_item) == 0) ? 1 : 0;
          } else if (id(current_page) == 3) {
            id(control_value) = std::max(id(control_value) - 5, 0);
            if (id(selected_entity_type) == 1) {
              id(script_update_light)->execute();
            } else if (id(selected_entity_type) == 2) {
              id(script_update_media)->execute();
            }
          }

binary_sensor:
  - platform: gpio
    id: dial_button
    name: "Dial Button"
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(current_page) == 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_menu_item) == 0;'
                then:
                  - lambda: 'id(current_page) = 1;'
                  - lvgl.page.show: page_lights
                else:
                  - lambda: 'id(current_page) = 2;'
                  - lvgl.page.show: page_media
      - if:
          condition:
            lambda: 'return id(current_page) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_menu_item) == 0;'
                then:
                  - lambda: |-
                      id(selected_entity_type) = 1;
                      id(current_page) = 3;
                  - lvgl.label.update:
                      id: control_title
                      text: "Brightness"
                  - lvgl.arc.update:
                      id: control_arc
                      value: !lambda 'return id(control_value);'
                  - lvgl.label.update:
                      id: control_value_label
                      text: !lambda |-
                        static char buf[16];
                        sprintf(buf, "%d%%", id(control_value));
                        return buf;
                  - lvgl.page.show: page_control
                else:
                  - lambda: 'id(current_page) = 0;'
                  - lvgl.page.show: page_main
      - if:
          condition:
            lambda: 'return id(current_page) == 2;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_menu_item) == 0;'
                then:
                  - lambda: |-
                      id(selected_entity_type) = 2;
                      id(current_page) = 3;
                  - lvgl.label.update:
                      id: control_title
                      text: "Volume"
                  - lvgl.arc.update:
                      id: control_arc
                      value: !lambda 'return id(control_value);'
                  - lvgl.label.update:
                      id: control_value_label
                      text: !lambda |-
                        static char buf[16];
                        sprintf(buf, "%d%%", id(control_value));
                        return buf;
                  - lvgl.page.show: page_control
                else:
                  - lambda: 'id(current_page) = 0;'
                  - lvgl.page.show: page_main
      - if:
          condition:
            lambda: 'return id(current_page) == 3;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_entity_type) == 1;'
                then:
                  - lambda: 'id(current_page) = 1;'
                  - lvgl.page.show: page_lights
                else:
                  - lambda: 'id(current_page) = 2;'
                  - lvgl.page.show: page_media

script:
  - id: script_update_menu_highlight
    then:
      - if:
          condition:
            lambda: 'return id(selected_menu_item) == 0;'
          then:
            - lvgl.widget.update:
                id: btn_lights
                bg_color: 0x555555
            - lvgl.widget.update:
                id: btn_media
                bg_color: 0x333333
          else:
            - lvgl.widget.update:
                id: btn_lights
                bg_color: 0x333333
            - lvgl.widget.update:
                id: btn_media
                bg_color: 0x555555
  - id: script_update_light
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: light.living_room
          data_template:
            brightness_pct: "{{ my_brightness }}"
          variables:
            my_brightness: return id(control_value);

  - id: script_update_media
    then:
      - homeassistant.service:
          service: media_player.volume_set
          data:
            entity_id: media_player.living_room
          data_template:
            volume_level: "{{ my_volume / 100.0 }}"
          variables:
            my_volume: return id(control_value);

font:
  - file: "gfonts://Montserrat"
    id: font_16
    size: 16
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core
  - file: "gfonts://Montserrat"
    id: font_24
    size: 24
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core

lvgl:
  displays:
    - main_display


  color_depth: 16
  buffer_size: 25%
  pages:
    - id: page_main
      bg_color: 0x1E1E1E
      widgets:
        - label:
            align: TOP_MID
            y: 40
            text: "Main Menu"
            text_color: 0xFFFFFF
            text_font: font_24
        - button:
            id: btn_lights
            align: CENTER
            y: -20
            width: 140
            height: 40
            bg_color: 0x333333
            radius: 20
            widgets:
              - label:
                  align: CENTER
                  text: "Lights"
                  text_color: 0xFFFFFF
                  text_font: font_16
            on_click:
              - lambda: 'id(current_page) = 1;'
              - lvgl.page.show: page_lights
        - button:
            id: btn_media
            align: CENTER
            y: 40
            width: 140
            height: 40
            bg_color: 0x333333
            radius: 20
            widgets:
              - label:
                  align: CENTER
                  text: "Media"
                  text_color: 0xFFFFFF
                  text_font: font_16
            on_click:
              - lambda: 'id(current_page) = 2;'
              - lvgl.page.show: page_media
    - id: page_lights
      bg_color: 0x1E1E1E
      widgets:
        - label:
            align: TOP_MID
            y: 40
            text: "Lights"
            text_color: 0xFFFFFF
            text_font: font_24
        - button:
            align: CENTER
            y: -10
            width: 180
            height: 40
            bg_color: 0x333333
            radius: 20
            widgets:
              - label:
                  align: CENTER
                  text: "Living Room Light"
                  text_color: 0xFFFFFF
                  text_font: font_16
            on_click:
              - lambda: |-
                  id(selected_entity_type) = 1;
                  id(current_page) = 3;
              - lvgl.label.update:
                  id: control_title
                  text: "Brightness"
              - lvgl.arc.update:
                  id: control_arc
                  value: !lambda 'return id(control_value);'
              - lvgl.label.update:
                  id: control_value_label
                  text: !lambda |-
                    static char buf[16];
                    sprintf(buf, "%d%%", id(control_value));
                    return buf;
              - lvgl.page.show: page_control
        - button:
            align: BOTTOM_MID
            y: -20
            width: 100
            height: 40
            bg_color: 0x550000
            radius: 15
            widgets:
              - label:
                  align: CENTER
                  text: "Back"
                  text_color: 0xFFFFFF
                  text_font: font_16
            on_click:
              - lambda: 'id(current_page) = 0;'
              - lvgl.page.show: page_main

    - id: page_media
      bg_color: 0x1E1E1E
      widgets:
        - label:
            align: TOP_MID
            y: 40
            text: "Media"
            text_color: 0xFFFFFF
            text_font: font_24
        - button:
            align: CENTER
            y: -10
            width: 180
            height: 40
            bg_color: 0x333333
            radius: 20
            widgets:
              - label:
                  align: CENTER
                  text: "Living Room TV"
                  text_color: 0xFFFFFF
                  text_font: font_16
            on_click:
              - lambda: |-
                  id(selected_entity_type) = 2;
                  id(current_page) = 3;
              - lvgl.label.update:
                  id: control_title
                  text: "Volume"
              - lvgl.arc.update:
                  id: control_arc
                  value: !lambda 'return id(control_value);'
              - lvgl.label.update:
                  id: control_value_label
                  text: !lambda |-
                    static char buf[16];
                    sprintf(buf, "%d%%", id(control_value));
                    return buf;
              - lvgl.page.show: page_control
        - button:
            align: BOTTOM_MID
            y: -20
            width: 100
            height: 40
            bg_color: 0x550000
            radius: 15
            widgets:
              - label:
                  align: CENTER
                  text: "Back"
                  text_color: 0xFFFFFF
                  text_font: font_16
            on_click:
              - lambda: 'id(current_page) = 0;'
              - lvgl.page.show: page_main
    - id: page_control
      bg_color: 0x1E1E1E
      widgets:
        - label:
            id: control_title
            align: TOP_MID
            y: 40
            text: "Control"
            text_color: 0xFFFFFF
            text_font: font_24
        - arc:
            id: control_arc
            align: CENTER
            width: 160
            height: 160
            arc_width: 10
            start_angle: 135
            end_angle: 45
            value: 50
            min_value: 0
            max_value: 100
            bg_opa: 0%
            arc_color: 0x333333
            indicator:
              arc_color: 0x36B9F6
              arc_width: 10
            knob:
              bg_opa: 0%
        - label:
            id: control_value_label
            align: CENTER
            text: "50%"
            text_color: 0xFFFFFF
            text_font: font_24
        - button:
            align: BOTTOM_MID
            y: -10
            width: 80
            height: 30
            bg_color: 0x550000
            radius: 15
            widgets:
              - label:
                  align: CENTER
                  text: "Back"
                  text_color: 0xFFFFFF
                  text_font: font_16
            on_click:
              - if:
                  condition:
                    lambda: 'return id(selected_entity_type) == 1;'
                  then:
                    - lambda: 'id(current_page) = 1;'
                    - lvgl.page.show: page_lights
                  else:
                    - lambda: 'id(current_page) = 2;'
                    - lvgl.page.show: page_media
